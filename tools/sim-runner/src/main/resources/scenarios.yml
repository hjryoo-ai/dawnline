# =============================================================================
# 시나리오 정의 (DESIGN.md §5.6 — "시나리오 YAML")
#
# 새 시나리오는 여기에 이름을 하나 더 만들면 된다. 코드를 고치지 않는다.
# driver 절이 있으면 route.assigned 를 구독해 기사까지 돈다(Phase 5-2). 없으면 주문만 넣는다.
# =============================================================================

dawnline:
  sim:
    scenarios:

      # Phase 1 의 최소 시나리오 — 주문 200건 (IMPLEMENTATION_PLAN Phase 1-9).
      #
      # 20 rps × 10초. 부하가 아니라 흐름을 만드는 것이 목적이다(부하는 tools/k6/orders.js).
      # customers=200 이면 고객당 평균 1건이라 §7.2 레이트 리밋(용량 60)에 닿지 않는다.
      smoke:
        orders: 200
        rate-per-second: 20
        seed: 20260904
        customers: 200
        cold-ratio: 0.25
        # §2.2 의 세 티어. 새벽 배송이 이 서비스의 주력이라는 전제를 비율로 적는다.
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2

      # 눈으로 확인할 때 쓰는 아주 작은 것. 스택이 떠 있는지만 본다.
      tiny:
        orders: 10
        rate-per-second: 5
        seed: 1
        customers: 10
        cold-ratio: 0.5
        tier-weights:
          DAWN: 1
          SAME_DAY: 1
          NEXT_DAY: 1

      # Phase 6 의 DoD 시나리오 — 운영자가 조기 마감하고 stop 을 옮길 웨이브 (tools/demo/phase6-demo.sh).
      #
      # 재배정은 **같은 계획의 다른 라우트**로만 된다(dispatch ReassignStopService) — 그래서 한 웨이브의
      # 계획이 라우트를 둘 이상 만들어야 한다. smoke 의 웨이브는 캠프·티어 29개에 2–19건이라 전부 라우트
      # 하나였다(2026-09-24 CI).
      #
      # **첫 판(600건)은 틀렸다**(2026-09-24 CI, 관측): 가장 큰 웨이브가 81건이었고 라우트는 하나였다.
      # 「새벽 창 안에 차 한 대가 돌 수 있는 stop 수」를 넘긴다고 짐작했지만, 야간 트럭 한 대(1,200 kg ·
      # 4 m³, 87,000원)가 81건(약 500 kg)을 다 싣고 밴 두 대(90,000원)보다 쌌다. 시각도 용량도 나누지 않았다.
      # 둘째 라우트를 **강제하는** 것은 하드 룰 `max-stops`(라우트당 120 stop, R__seed_dispatch) 하나다 —
      # 용량(트럭 약 195건)보다 먼저 닿고, 이동 시간·비용 계수와 무관하다. 그래서 가장 큰 웨이브가 120 을
      # 넘게 한다: 1,200건. customers 는 600 그대로 둔다 — 고객 풀이 같으면 난수열이 같아서 **앞 600건은
      # 관측한 실행과 같은 주문**이고(그 웨이브의 81건이 그대로 남는다), 뒤 600건이 그 위에 쌓인다.
      # 고객당 평균 2건이라 §7.2 레이트 리밋(용량 60)에 닿지 않는다. 데모는 마감 **전에** 그 웨이브의 주문이
      # 상한을 넘는지 보고(필요조건 — 통합은 stop 을 줄이기만 한다), 마감 뒤에 라우트 수를 본다.
      ops-demo:
        orders: 1200
        rate-per-second: 20
        seed: 20260924
        customers: 600
        cold-ratio: 0.25
        tier-weights:
          DAWN: 1

      # Phase 5-2 의 DoD 시나리오 — 늦게 출발한 기사 (IMPLEMENTATION_PLAN Phase 5-2).
      #
      # 출발을 최대 30분 늦추고 구간마다 최대 60%를 더 쓴다. 그 지연이 곧 tracking 이
      # 계산하는 편차이므로(occurredAt 이 계획에서 파생되기 때문) at-risk 가 난다 —
      # 이 시나리오가 확인하는 것은 "at-risk 가 났다" 까지다. **몇 번 났는지는 보지 않는다**:
      # 쿨다운 TTL 은 벽시계 5분인데 여기서는 시뮬레이션 시각이 600배로 흐르므로 라우트당
      # 한 번만 보인다. 그것은 시뮬레이터의 제약이지 tracking 의 규칙이 아니다(ADR-046).
      # 횟수를 보려면 speed 를 1 로 두고 실제 시간만큼 기다린다.
      late-injection:
        orders: 60
        rate-per-second: 20
        seed: 20260919
        customers: 60
        cold-ratio: 0.25
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          # 기다릴 라우트 수. 계획이 이보다 많이 만들면 나머지 기사는 실행이 끝날 때 끊긴다.
          routes: 1
          # 시뮬레이션 초 ÷ 벽시계 초. 4시간짜리 라우트가 24초에 끝난다.
          speed: 600
          timeout-seconds: 300
          scan-retry-seconds: 30
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}
          # 늦게 출발하는 것이 가장 흔한 지연 원인이고, 첫 도착 스캔 전에 이미 알 수 있다(§5.4).
          departure-delay-seconds: 1800
          delay-probability: 1.0
          delay-magnitude: 0.6
          failure-probability: 0.05

      # ----------------------------------------------------------------------------------------------------------
      # 창 시나리오 넷 — DAWN 컷오프(00:00 KST) 앞의 한 시간 (DESIGN.md 부록 A 「창은 하나다」, 7-4a).
      #
      # 하루가 아니라 창이다: §8.2 의 「컷오프 직전 1시간에 30% 집중」이 피크의 모양이고, normal-day 도 같은 창으로 돈다 —
      # 비교 축이 같아야 표가 읽힌다. start-at 은 **유효 시각**(주입 시계)이다 — 시뮬레이션 스택(make sim-up, ADR-066)이
      # 그 시각을 아무 때나 만들고, sim-runner 는 같은 오프셋의 시계로 기다린다. 22:58 에 시작해 한 시간, 끝이 컷오프보다
      # 2분 앞 — 보내는 쪽이 밀려도 마지막 주문이 컷오프를 넘지 않는 여유다. 속도는 창 전체에 균일하다(순간 버스트는 k6).
      #
      # 고객은 주문의 절반 — 고객당 평균 2건이라 §7.2 레이트 리밋(용량 60)에 닿지 않는다.
      # 티어 비율은 smoke 와 같다. SAME_DAY 는 다음 날 10:00 웨이브로 가서 이 창의 측정 밖이다.
      #
      # fleet (ADR-067) — 창이 끝나면(23:58) 창의 DAWN 웨이브마다 dispatch 의 함대 판정(80% 기준)을 ops-api 로 읽는다.
      #   feasible : 부족 대수만큼 템플릿을 증차한다(source=peak-sim, 감사 행 ADD_VEHICLE) — peak-day
      #   as-is    : 재고 리포트하되 더하지 않는다 — 「증차 없음」. overload-day 와 평일 둘
      # 증차가 그 웨이브의 closed_at 뒤에 끝났으면 실패한다(시간 예산은 어설션이다). 끝나면 이번 실행이 더한 차량만 비활성화한다.
      # 운영자 토큰이 필요하다: DAWNLINE_SIM_OPS_TOKEN=$(make token ROLE=OPS_OPERATOR).
      #
      # driver — 창의 기사는 계획이 정한 라우트 수(창의 웨이브들의 route_count 합)를 전부 기다린다. routes 를 적지 않는다.
      # 기사가 없으면 라우트가 끝나지 않고, 끝나지 않은 stop 이 있는 차량은 비활성화되지 않는다(409 — ADR-067 결정 5).
      # 지연 · 실패 주입은 0 이다 — §8.1 정시율(지연 5%)은 7-4 가 잰다.
      # ----------------------------------------------------------------------------------------------------------

      # 평일 — 하루 3만(§8.2)의 30%.
      normal-day:
        orders: 9000
        rate-per-second: 2.5
        seed: 20260927
        customers: 4500
        cold-ratio: 0.25
        start-at: "22:58"
        fleet: as-is
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          speed: 600
          # 수천 라우트가 가상 스레드마다 동시에 돈다 — 가장 긴 라우트(07:00 까지)가 배속 600 에서 1분 안쪽이고,
          # 나머지는 계획 · 소비의 지연이다.
          timeout-seconds: 1800
          scan-retry-seconds: 60
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}

      # 피크 — 하루 15만의 30%. 함대는 실현 가능성 기준(80%)이 정한다 — 운영자처럼 증차한다(ADR-067).
      peak-day:
        orders: 45000
        rate-per-second: 12.5
        seed: 20260928
        customers: 22500
        cold-ratio: 0.25
        start-at: "22:58"
        fleet: feasible
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          speed: 600
          # 수천 라우트가 가상 스레드마다 동시에 돈다 — 가장 긴 라우트(07:00 까지)가 배속 600 에서 1분 안쪽이고,
          # 나머지는 계획 · 소비의 지연이다.
          timeout-seconds: 1800
          scan-retry-seconds: 60
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}

      # 피크 + 흔들림 — peak-day 에 취소와 지연 · 실패를 더한다(7-4 turbulent, 2026-09-28 결정). 창 시나리오 넷이 판정하지 못한 행
      # (7-0 A18 cancel_too_late · A20 출발 정시율 · B5 scan_after_cancel …)의 데이터가 여기서 나온다. 물량 · seed · 함대는 peak-day 그대로다.
      #
      # 지연 — 구간의 15% 가 최대 30% 더 걸리고, 같은 15% 의 라우트가 최대 15분 늦게 떠난다(출발도 같은 확률을 따른다 — SeededJitter).
      #   15분은 at-risk 문턱(약속창 끝 − 15분)과 같은 크기다: 2차 peak-day 에서 07:29 에 끝난 냉장 트럭은 위험으로 잡히고 02:19 에 끝난 밴은
      #   잡히지 않는다 — 두 갈래가 다 나오는 값이다. 0.6 · 1800 초(late-injection)는 15% 에 걸기엔 「전부 위험」이라 판정이 갈리지 않는다.
      # 실패 — 전달의 3%.
      # 취소 — DAWN 주문의 2%, 절반은 계획 전(접수 직후 — 창 안) · 절반은 발행 뒤(계획이 끝난 직후부터 초당 20건). 발행 뒤 취소의 대부분은
      #   order-service 의 409(이미 DISPATCHED)이고, 그 비율이 order.dispatched 반영 전의 창의 폭이다(A18).
      peak-day-turbulent:
        orders: 45000
        rate-per-second: 12.5
        seed: 20260928
        customers: 22500
        cold-ratio: 0.25
        start-at: "22:58"
        fleet: feasible
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        cancel:
          ratio: 0.02
          before-plan: 0.5
          rate-per-second: 20
        driver:
          speed: 600
          timeout-seconds: 1800
          scan-retry-seconds: 60
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}
          delay-probability: 0.15
          delay-magnitude: 0.3
          failure-probability: 0.03
          departure-delay-seconds: 900

      # 과부하 — 같은 물량(같은 seed), 함대 그대로(「증차 없음」 — 재기는 하므로 리포트의 계산 부족분이 「얼마나 과부하였나」다).
      # 열화 사다리 · 미배정 정책 · 계획 시간 상한의 판정 데이터다.
      overload-day:
        orders: 45000
        rate-per-second: 12.5
        seed: 20260928
        customers: 22500
        cold-ratio: 0.25
        start-at: "22:58"
        fleet: as-is
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          speed: 600
          # 수천 라우트가 가상 스레드마다 동시에 돈다 — 가장 긴 라우트(07:00 까지)가 배속 600 에서 1분 안쪽이고,
          # 나머지는 계획 · 소비의 지연이다.
          timeout-seconds: 1800
          scan-retry-seconds: 60
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}

      # 평일 물량에 냉장 40% — 좌석 예약(ADR-039)이 수요 쪽에서 눌리는 유일한 시나리오.
      cold-heavy:
        orders: 9000
        rate-per-second: 2.5
        seed: 20260929
        customers: 4500
        cold-ratio: 0.40
        start-at: "22:58"
        fleet: as-is
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          speed: 600
          # 수천 라우트가 가상 스레드마다 동시에 돈다 — 가장 긴 라우트(07:00 까지)가 배속 600 에서 1분 안쪽이고,
          # 나머지는 계획 · 소비의 지연이다.
          timeout-seconds: 1800
          scan-retry-seconds: 60
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}
