# =============================================================================
# 시나리오 정의 (DESIGN.md §5.6 — "시나리오 YAML")
#
# 새 시나리오는 여기에 이름을 하나 더 만들면 된다. 코드를 고치지 않는다.
# driver 절이 있으면 route.assigned 를 구독해 기사까지 돈다(Phase 5-2). 없으면 주문만 넣는다.
# =============================================================================

dawnline:
  sim:
    scenarios:

      # Phase 1 의 최소 시나리오 — 주문 200건 (IMPLEMENTATION_PLAN Phase 1-9).
      #
      # 20 rps × 10초. 부하가 아니라 흐름을 만드는 것이 목적이다(부하는 tools/k6/orders.js).
      # customers=200 이면 고객당 평균 1건이라 §7.2 레이트 리밋(용량 60)에 닿지 않는다.
      smoke:
        orders: 200
        rate-per-second: 20
        seed: 20260904
        customers: 200
        cold-ratio: 0.25
        # §2.2 의 세 티어. 새벽 배송이 이 서비스의 주력이라는 전제를 비율로 적는다.
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2

      # 눈으로 확인할 때 쓰는 아주 작은 것. 스택이 떠 있는지만 본다.
      tiny:
        orders: 10
        rate-per-second: 5
        seed: 1
        customers: 10
        cold-ratio: 0.5
        tier-weights:
          DAWN: 1
          SAME_DAY: 1
          NEXT_DAY: 1

      # Phase 6 의 DoD 시나리오 — 운영자가 조기 마감하고 stop 을 옮길 웨이브 (tools/demo/phase6-demo.sh).
      #
      # 재배정은 **같은 계획의 다른 라우트**로만 된다(dispatch ReassignStopService) — 그래서 한 웨이브의
      # 계획이 라우트를 둘 이상 만들어야 한다. smoke 의 웨이브는 캠프·티어 29개에 2–19건이라 전부 라우트
      # 하나였다(2026-09-24 CI).
      #
      # **첫 판(600건)은 틀렸다**(2026-09-24 CI, 관측): 가장 큰 웨이브가 81건이었고 라우트는 하나였다.
      # 「새벽 창 안에 차 한 대가 돌 수 있는 stop 수」를 넘긴다고 짐작했지만, 야간 트럭 한 대(1,200 kg ·
      # 4 m³, 87,000원)가 81건(약 500 kg)을 다 싣고 밴 두 대(90,000원)보다 쌌다. 시각도 용량도 나누지 않았다.
      # 둘째 라우트를 **강제하는** 것은 하드 룰 `max-stops`(라우트당 120 stop, R__seed_dispatch) 하나다 —
      # 용량(트럭 약 195건)보다 먼저 닿고, 이동 시간·비용 계수와 무관하다. 그래서 가장 큰 웨이브가 120 을
      # 넘게 한다: 1,200건. customers 는 600 그대로 둔다 — 고객 풀이 같으면 난수열이 같아서 **앞 600건은
      # 관측한 실행과 같은 주문**이고(그 웨이브의 81건이 그대로 남는다), 뒤 600건이 그 위에 쌓인다.
      # 고객당 평균 2건이라 §7.2 레이트 리밋(용량 60)에 닿지 않는다. 데모는 마감 **전에** 그 웨이브의 주문이
      # 상한을 넘는지 보고(필요조건 — 통합은 stop 을 줄이기만 한다), 마감 뒤에 라우트 수를 본다.
      ops-demo:
        orders: 1200
        rate-per-second: 20
        seed: 20260924
        customers: 600
        cold-ratio: 0.25
        tier-weights:
          DAWN: 1

      # Phase 5-2 의 DoD 시나리오 — 늦게 출발한 기사 (IMPLEMENTATION_PLAN Phase 5-2).
      #
      # 출발을 최대 30분 늦추고 구간마다 최대 60%를 더 쓴다. 그 지연이 곧 tracking 이
      # 계산하는 편차이므로(occurredAt 이 계획에서 파생되기 때문) at-risk 가 난다 —
      # 이 시나리오가 확인하는 것은 "at-risk 가 났다" 까지다. **몇 번 났는지는 보지 않는다**:
      # 쿨다운 TTL 은 벽시계 5분인데 여기서는 시뮬레이션 시각이 600배로 흐르므로 라우트당
      # 한 번만 보인다. 그것은 시뮬레이터의 제약이지 tracking 의 규칙이 아니다(ADR-046).
      # 횟수를 보려면 speed 를 1 로 두고 실제 시간만큼 기다린다.
      late-injection:
        orders: 60
        rate-per-second: 20
        seed: 20260919
        customers: 60
        cold-ratio: 0.25
        tier-weights:
          DAWN: 5
          SAME_DAY: 3
          NEXT_DAY: 2
        driver:
          # 기다릴 라우트 수. 계획이 이보다 많이 만들면 나머지 기사는 실행이 끝날 때 끊긴다.
          routes: 1
          # 시뮬레이션 초 ÷ 벽시계 초. 4시간짜리 라우트가 24초에 끝난다.
          speed: 600
          timeout-seconds: 300
          scan-retry-seconds: 30
          scan-base-url: ${DAWNLINE_SIM_SCAN_BASE_URL:http://localhost:8084}
          # 늦게 출발하는 것이 가장 흔한 지연 원인이고, 첫 도착 스캔 전에 이미 알 수 있다(§5.4).
          departure-delay-seconds: 1800
          delay-probability: 1.0
          delay-magnitude: 0.6
          failure-probability: 0.05
