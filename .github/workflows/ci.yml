# =============================================================================
# Dawnline CI — DESIGN.md §14(CI/CD 파이프라인), §13(테스트 전략)
#
# §14 가 정의한 전체 단계:
#   checkout → JDK 25 → Gradle 캐시 → ./gradlew build → 통합 테스트(Testcontainers)
#   → benchmark 회귀 게이트 → 이미지 빌드 → Compose 스모크 → 결과 아티팩트
#
# 지금(Phase 3 마감) 실제로 도는 것: 위 전부 + Compose 스모크 + 리포트 아티팩트.
# 나머지는 산출물이 아직 없으므로 `if: false` 로 꺼 둔 자리(job 이름에 Phase 표기)다.
# 활성화 방법은 각 job 의 `if: false` 줄 주석에 적어 두었다.
#   - 이미지 빌드     : Phase 7 (release.yml 의 GHCR 푸시가 생긴 뒤. 지금은 compose-smoke 가
#                       같은 빌드를 하므로 켜면 같은 일을 두 번 한다)
#   - Compose 스모크  : 2026-09-05 활성화 (Phase 3-7)
#   - OpenAPI 아티팩트: Phase 1 (파일이 생기면 hashFiles 조건으로 자동 활성화)
# 없는 것을 실행해 CI 를 빨갛게 만들지 않는다 — 이 워크플로는 지금 상태에서 녹색이어야 한다.
#
# 참고: actionlint 는 `if: false` 를 "constant expression" 으로 지적한다(if-cond). 의도한
#       비활성화 표시이므로 무시한다 — 활성화가 코드 한 줄 삭제로 끝나고, 저장소 설정
#       (repository variable)에 숨은 상태를 만들지 않는 편을 택했다.
#
# 액션 버전(2026-08-29 GitHub API 로 최신 릴리스 확인, major 태그로 고정):
#   actions/checkout v7.0.1 · actions/setup-java v6.0.0
#   gradle/actions v6.3.0   · actions/upload-artifact v7.0.1
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR 의 이전 실행은 취소한다. main 은 커밋별 결과를 남겨야 하므로 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 최소 권한. 아티팩트 업로드는 contents: read 로 충분하다.
permissions:
  contents: read

env:
  # gradle/libs.versions.toml 의 java = "25" 와 반드시 같아야 한다 (DESIGN.md §11).
  JAVA_VERSION: "25"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 0) 마이그레이션 불변 검사 (CLAUDE.md 불변규칙 13)
  #    이미 머지된 Flyway 스크립트를 고치면 그것을 적용해 둔 데이터베이스에서
  #    체크섬 불일치로 기동이 깨진다. 사람이 기억해야 하는 규칙을 하나 줄인다.
  #
  #    pull_request 이벤트의 HEAD 는 "base 에 PR 을 병합한 커밋" 이므로
  #    HEAD^1 이 곧 base 브랜치의 그 시점 커밋이다 — 추가 fetch 없이 비교할 수 있다.
  # ---------------------------------------------------------------------------
  migrations:
    name: 마이그레이션 불변 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          # HEAD^1(base) 을 보려면 병합 커밋의 양쪽 부모가 있어야 한다.
          fetch-depth: 2

      - name: 기존 마이그레이션이 수정·삭제·이동되지 않았는지 확인
        run: |
          # M(수정) D(삭제) R(이동) 만 본다. 추가(A)는 정상적인 변경 방법이다.
          changed=$(git diff --diff-filter=MDR --name-only HEAD^1 HEAD -- '*/db/migration/*' || true)
          if [ -n "$changed" ]; then
            echo "::error::이미 머지된 Flyway 스크립트가 바뀌었습니다 (CLAUDE.md 불변규칙 13)."
            echo "$changed" | while read -r f; do echo "::error file=$f::이 파일은 불변입니다. 새 V<다음번호>__*.sql 을 추가하세요."; done
            echo ""
            echo "왜 예외가 없는가: Flyway 는 적용된 스크립트의 체크섬을 기록한다."
            echo "파일이 바뀌면 그것을 이미 적용한 DB(로컬 make up 볼륨 포함)가 기동에서 깨진다."
            echo "'아직 배포된 적 없으니까' 는 이 규칙을 무너뜨리는 전형적인 첫 예외다."
            exit 1
          fi
          echo "기존 마이그레이션 변경 없음."

  # ---------------------------------------------------------------------------
  # 1) 빌드 + 단위/ArchUnit/계약 테스트 + JaCoCo 게이트
  #    ./gradlew build = assemble + check (컨벤션 플러그인이 check 에
  #    jacocoTestReport·jacocoTestCoverageVerification 을 묶어 둔다)
  # ---------------------------------------------------------------------------
  build:
    name: 빌드 · 단위/ArchUnit/계약 테스트 · 커버리지 게이트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # settings.gradle.kts 의 foojay resolver 가 JDK 25 를 자동 프로비저닝하므로
      # setup-java 없이도 빌드는 된다. 그래도 미리 설치하는 이유:
      #   (1) 잡마다 Temurin 25 를 새로 내려받는 시간(~200MB)을 아낀다
      #   (2) java-conventions 의 toolchain vendor = ADOPTIUM 을 그대로 만족시킨다
      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # 캐시는 아래 setup-gradle 이 더 정교하게 처리하므로 여기서는 켜지 않는다.

      # Gradle User Home 캐시 + Wrapper 체크섬 검증(validate-wrappers 기본값 true).
      # cache-provider: basic — MIT 라이선스 오픈소스 구현(actions/cache 래퍼)만 쓴다.
      #   기본값 'enhanced' 는 프로프라이어터리 컴포넌트라 포트폴리오 저장소에서는 피한다.
      # 캐시 쓰기는 기본 정책대로 main(기본 브랜치)에서만 일어나고 PR 은 읽기 전용이다.
      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # gradle.properties 는 설정 캐시(configuration-cache)를 켜 두었다. 설정 캐시
          # 데이터는 암호화 키가 있어야 잡 사이에 보존된다. 시크릿이 없으면 빈 값이 되고
          # 설정 캐시만 매번 새로 계산될 뿐 빌드는 정상 동작한다.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 빌드 + 검증
        run: ./gradlew build

      - name: 테스트·커버리지 리포트 아티팩트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/test-results/**/*.xml
          retention-days: 7
          # Phase 0 에는 테스트가 아직 적어 리포트가 없을 수 있다. 없다고 실패시키지 않는다.
          if-no-files-found: ignore

      # Phase 1 에서 order-service 가 contracts/openapi/*.yaml 을 생성하면
      # 별도 수정 없이 이 스텝이 자동으로 켜진다 (DESIGN.md §14 "결과 아티팩트: OpenAPI").
      - name: OpenAPI 계약 아티팩트
        if: always() && hashFiles('contracts/openapi/*.yaml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: openapi-contracts
          path: contracts/openapi/*.yaml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) 통합 테스트 (Testcontainers — PostgreSQL 18 / Kafka 4.3 / Redis 8)
  #
  # 블로킹 여부 결정: **블로킹(필수)** 으로 둔다.
  #   - Phase 0 DoD 자체가 "outbox INSERT → 릴레이 → Kafka 수신 → 멱등 소비" 통합
  #     테스트의 통과다. continue-on-error 로 두면 이 회귀를 그대로 머지하게 된다.
  #   - CLAUDE.md "테스트를 약화시키지 마라" 와도 어긋난다.
  #   - 다만 컴파일조차 안 되는 변경으로 러너 시간을 낭비하지 않도록 build 성공 후에만
  #     돌린다(needs: build). 이미지 pull 이 있어 build 잡보다 느리므로 잡을 분리했다.
  #   - 플레이키가 생기면 continue-on-error 가 아니라 원인(대기 조건·타임아웃)을 고친다.
  # ---------------------------------------------------------------------------
  integration-test:
    name: 통합 테스트 (Testcontainers)
    needs: build
    runs-on: ubuntu-latest  # 러너에 Docker 가 기본 설치되어 있다
    timeout-minutes: 30
    env:
      # buildSrc 의 integrationTest 태스크는 로컬 실행 시간 단축을 위해
      # testcontainers.reuse.enable=true 를 켠다(DESIGN.md §13). CI 러너는 잡마다
      # 새로 뜨므로 재사용할 컨테이너가 없고, 재사용 모드는 Ryuk 정리만 막는다.
      # 따라서 환경변수로 명시적으로 끈다.
      TESTCONTAINERS_REUSE_ENABLE: "false"
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # build 잡이 이미 캐시를 채웠다. 같은 워크플로 안에서 중복으로 쓰지 않는다.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 통합 테스트
        run: ./gradlew integrationTest

      - name: 통합 테스트 리포트 아티팩트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            **/build/reports/tests/integrationTest/**
            **/build/test-results/integrationTest/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) 벤치마크 회귀 게이트 — DESIGN.md §6.9, §14, IMPLEMENTATION_PLAN Phase 3-4
  #
  #    규칙 두 가지:
  #      * 게이트는 **비용만** 본다. 두 전략을 같은 실행 안에서 돌리므로 비용 비교는 러너에
  #        독립이지만 계획 시간은 아니다. 시간은 리포트에 기록만 한다.
  #      * 기준 전략 `baseline-nn` 은 **코드 수준으로 동결**이다. BaselineFrozenTest 가 지킨다.
  #
  #    데이터셋이 medium 인 이유(2026-09-05 결정): small(차량 5대)은 클러스터링이 값을 만들
  #    자유도가 구조적으로 없는 레짐이다 — 최소 필요 차량이 4대라 "누구를 어느 차에" 의 선택지가
  #    사실상 없다. medium(20대)이 그 자유도가 처음 생기는 크기다. small 에서 스윕이 지는 것은
  #    지워지지 않고 docs/benchmarks/phase3-baseline.md §4-5 에 수치로 남아 있다.
  # ---------------------------------------------------------------------------
  benchmark:
    name: 벤치마크 medium 회귀 게이트 (Phase 3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # seed 고정으로 결정론이 보장된다(CLAUDE.md 불변규칙 12).
      # --gate 는 기준보다 비싼 전략이 있으면 종료 코드 1 을 낸다. 리포트는 그 전에 쓰이므로
      # 실패해도 아티팩트에 "왜" 가 남는다.
      - name: medium 데이터셋 전략 비교 + 게이트
        run: |
          ./gradlew :tools:benchmark:run --args='--dataset medium --repeats 5 --strategies baseline-nn,sweep-greedy-nn --gate baseline-nn --out build/reports/benchmark/medium.md'

      - name: 벤치마크 리포트 아티팩트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-medium
          path: build/reports/benchmark/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4) 컨테이너 이미지 빌드 — DESIGN.md §14
  #    빌더 선택은 §14 에서 아직 [결정 필요](Jib vs Buildpacks)이고,
  #    buildSrc/dawnline.spring-service 는 Buildpacks(bootBuildImage)를 전제로 배선되어 있다.
  #    GHCR 푸시는 release.yml(Phase 7) 담당이고 여기서는 빌드만 검증한다.
  # ---------------------------------------------------------------------------
  image:
    name: 컨테이너 이미지 빌드 (Phase 7)
    # 활성화: 서비스에 Spring Boot main 클래스가 생겨 bootJar 가 만들어진 뒤 이 줄을 삭제한다.
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: 서비스 이미지 빌드 (Buildpacks)
        run: ./gradlew bootBuildImage

  # ---------------------------------------------------------------------------
  # 5) Compose 스모크 (주문 20건 E2E) — DESIGN.md §13 "시스템" 계층, §14
  #    sim-runner 의 smoke 시나리오가 Phase 3 에서 완성된다.
  # ---------------------------------------------------------------------------
  # 2026-09-05 활성화 (Phase 3-7 마감). 켜면서 두 가지를 고쳤다.
  #   * needs 에서 image 를 뺐다. 그 job 은 **다른 러너**에서 빌드하므로 이미지가 여기
  #     로컬 데몬에 없고, make up 의 check-images 가 바로 실패한다. 아티팩트로 옮기는 것은
  #     이미지 5개 × 수백 MB 라 빌드보다 비싸다 — 여기서 직접 빌드한다.
  #   * 그래서 `make images` 단계를 앞에 둔다. image job 은 Phase 7 에 GHCR 푸시를 얻으면
  #     그때 제 몫이 생긴다(지금은 이 job 과 같은 일을 한 번 더 하는 것뿐이라 꺼 둔다).
  compose-smoke:
    name: Compose 스모크 (Phase 3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }} 설치 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정 · 캐시
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: 환경 파일 준비
        run: cp deploy/compose/.env.example deploy/compose/.env

      - name: 서비스 이미지 빌드 (Buildpacks)
        run: make images

      - name: 스택 기동
        run: make up

      # phase2-demo.sh + phase3-demo.sh — 주문 200건 → 웨이브 마감 → 계획 → 라우트 →
      # GET /api/v1/plans/{id} 까지를 DB 와 브로커 양쪽에서 확인한다 (Phase 2·3 DoD).
      - name: 스모크 시나리오 (주문 → 라우트 E2E)
        run: make demo

      - name: 컨테이너 로그 수집
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color > compose-logs.txt

      - name: 스모크 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-logs
          path: compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      # 데이터 볼륨까지 지우는 `down -v` 는 쓰지 않는다 (CLAUDE.md "하지 말 것").
      - name: 스택 종료
        if: always()
        run: make down
