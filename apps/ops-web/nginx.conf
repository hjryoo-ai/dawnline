# ops-web (ADR-057 결정 2) — 정적 파일과 /api/ 프록시. 같은 출처라 ops-api 에 CORS 를 열지 않는다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 이름을 요청 때 푼다 — ops-api 가 늦게 떠도 nginx 가 기동에서 죽지 않는다(Docker 의 내장 DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ops_api http://ops-api:8080;

    location /api/ {
        # 요청의 Authorization 과 응답의 X-Dawnline-Audit-Id 를 그대로 통과시킨다 — nginx 의 기본 동작이지만 명시한다.
        # 빠지면 앞의 것은 모든 조회를 401 로, 뒤의 것은 UNKNOWN 감사 행을 해소할 id 를 지운다. 스모크가 둘을 본다(C3).
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header X-Dawnline-Audit-Id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass $ops_api;
    }

    # 화면 주소는 해시(#/…)라 경로는 / 하나다. 그래도 index.html 로 물러나 새로 고침이 404 가 되지 않게 한다.
    location / {
        try_files $uri /index.html;
    }
}
