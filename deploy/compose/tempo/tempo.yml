# =============================================================================
# Dawnline Tempo 설정 (DESIGN.md §9.2)
#
# 단일 바이너리(all-in-one) 모드 · 로컬 파일 스토리지.
# 트레이스는 otel-collector 가 OTLP/gRPC 로 밀어 넣는다.
#
# 데모 목적: 웨이브 하나의 일(주문 트레이스 + 계획 트레이스)이 TraceQL 한 줄
#            { span.dawnline.wave_id = "…" } 로 order → fulfillment → dispatch → tracking 을
#            지나는 것이 Grafana 에서 보여야 한다(§9.2 정정, ADR-062).
# =============================================================================

# Grafana 의 TraceQL 결과 스트리밍(gRPC over HTTP)을 허용한다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # 로컬 데모는 즉시 조회가 중요하므로 블록을 짧게 끊는다.
  max_block_duration: 1m

compactor:
  compaction:
    # 로컬 디스크 보호: 24시간 지난 블록은 삭제한다.
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# 서비스 그래프 (§9.2, 7-2) — 스팬의 부모-자식 쌍이 서비스 경계를 넘으면 간선 하나를 센다
# (traces_service_graph_request_total{client, server}). HTTP 는 CLIENT→SERVER, Kafka 는 PRODUCER→CONSUMER 쌍이다.
# 결과는 Prometheus 로 remote-write 한다(prometheus 의 --web.enable-remote-write-receiver).
# span 메트릭 프로세서는 켜지 않는다 — 서비스의 Micrometer 가 이미 같은 것(http_server_requests_* · 리스너 관측)을 긁힌다.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
