# =============================================================================
# Dawnline Prometheus 스크레이프 설정 (DESIGN.md §9.1)
#
# 코어 서비스 5개의 Micrometer Prometheus 엔드포인트를 긁는다.
# 컨테이너 안에서는 모든 서비스가 8080 을 쓴다(호스트 포트만 서로 다르다).
#
# 알림 규칙은 ./rules/dawnline-alerts.yml 이다(§9.4 알림 표 — AlertRulesConsistencyTest 가 대조한다, ADR-060).
# 식의 동작은 ./tests/ 의 promtool 단위 테스트가 보고, PrometheusRulesIT 가 컨테이너에서 돌린다.
# Alertmanager 는 두지 않는다 — 알림은 Prometheus 의 /alerts 와 Grafana 에서 본다(로컬 스택의 범위).
# =============================================================================

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    env: local
    stack: dawnline

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 코어 서비스. 아직 이미지가 뜨지 않았다면 타깃이 DOWN 으로 보이는 게 정상이다.
  - job_name: dawnline-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]
        labels: { service: order-service }
      - targets: ["fulfillment-service:8080"]
        labels: { service: fulfillment-service }
      - targets: ["dispatch-service:8080"]
        labels: { service: dispatch-service }
      - targets: ["tracking-service:8080"]
        labels: { service: tracking-service }
      - targets: ["ops-api:8080"]
        labels: { service: ops-api }
