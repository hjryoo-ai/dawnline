# =============================================================================
# lean 오버레이 — `make up-lean` 전용 (인프라 + 서비스, 관측성 스택 없음)
#
# 기본 docker-compose.yml 은 obs 프로파일(otel-collector)이 함께 뜨는 것을 전제로
# OTEL_EXPORTER_OTLP_ENDPOINT 를 http://otel-collector:4318 로 준다.
# lean 에서는 그 컨테이너가 없으므로 내보내기가 13초마다 실패하고
# io.opentelemetry...HttpExporter 가 UnknownHostException 스택트레이스를 ERROR 로 쏟는다
# (실측: 5개 서비스 기동 몇 분 만에 ERROR 113건). 로그가 이래서는 진짜 오류를 못 찾는다.
#
# 그래서 **내보내기만** 끈다. 계측 자체는 살려 둔다:
#   management.tracing.export.enabled=false      → 스팬 수집은 하되 OTLP 전송을 안 한다.
#                                                   traceId/spanId 는 그대로 MDC 에 남는다.
#   management.otlp.metrics.export.enabled=false → OTLP 메트릭 푸시만 끈다.
#                                                   /actuator/prometheus 는 계속 동작한다.
# (두 키 모두 spring-boot 4.1.1 의 spring-configuration-metadata.json 에서 존재를 확인했다.
#  기본값은 둘 다 true.)
#
# 관측성까지 보려면 lean 이 아니라 `make up` 을 쓴다.
# =============================================================================

x-lean-otel: &lean-otel
  MANAGEMENT_TRACING_EXPORT_ENABLED: "false"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

services:
  order-service:
    environment: *lean-otel
  fulfillment-service:
    environment: *lean-otel
  dispatch-service:
    environment: *lean-otel
  tracking-service:
    environment: *lean-otel
  ops-api:
    environment: *lean-otel
