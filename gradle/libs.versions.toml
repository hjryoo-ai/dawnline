# =============================================================================
# Dawnline 버전 카탈로그 — 라이브러리 버전은 여기서만 고정한다 (CLAUDE.md, DESIGN.md §11).
# 인프라 이미지 버전은 deploy/compose/.env 에서만 고정한다.
#
# 원칙: Spring Boot BOM 이 관리하는 것은 여기에 버전을 쓰지 않는다.
#       BOM 이 관리하는 주요 버전(Boot 4.1.1 기준, 2026-08-29 확인):
#         Spring Framework 7.0.9 · Spring Kafka 4.1.1 · Spring Security 7.1.1
#         Hibernate ORM 7.4.5.Final · Flyway 12.4.0 · Testcontainers 2.0.5
#         JUnit Jupiter 6.0.3 · Jackson 3.1.5 (+ jackson-2-bom 2.21.5)
#         Micrometer 1.17.1 · Micrometer Tracing 1.7.1 · OpenTelemetry 1.62.0
#         JSpecify 1.0.1 · Lettuce 7.5.2 · PostgreSQL JDBC 42.7.13
# =============================================================================

[versions]
java = "25"
spring-boot = "4.1.1"

# --- BOM 이 관리하지 않는 것만 고정 ---
archunit = "1.5.0"
json-schema-validator = "3.0.7"   # 계약 테스트 (contracts/events/*.schema.json)
springdoc = "3.1.1"               # Spring Boot 4 라인 (parent: spring-boot-starter-parent 4.1.0)
resilience4j = "2.4.0"            # Boot 4 전용 모듈: resilience4j-spring-boot4
jacoco = "0.8.15"
openapi-generator = "7.25.0"   # ops-api 위임 클라이언트 — 커밋된 contracts/openapi/*.yaml 에서 생성 (ADR-052)

[libraries]
# --- 플랫폼 (BOM) ---
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# --- 빌드 플러그인 아티팩트 (buildSrc 컨벤션 플러그인 클래스패스용) ---
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }

# --- Spring Boot 스타터 ---
spring-boot-starter                 = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web             = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation      = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa        = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis      = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-actuator        = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security        = { module = "org.springframework.boot:spring-boot-starter-security" }
# ops-api 의 JWT 검증 (DESIGN.md §5.5 · §10, ADR-052 결정 2). Boot 4 의 이름이다 — 접두어 없는
# spring-boot-starter-oauth2-resource-server 도 4.1.1 에 있고 내용이 같지만, 모듈 이름을 따르는 쪽을 쓴다.
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
# ops-api → 코어 위임의 RestClient.Builder 자동 구성 (Boot 4 모듈화: starter-web 에 없다).
# 관측(트레이스 전파)이 붙은 빌더가 여기서 온다 — 손으로 RestClient.create() 하면 전파가 끊긴다.
spring-boot-starter-restclient      = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-test            = { module = "org.springframework.boot:spring-boot-starter-test" }
# Boot 4 모듈화: MockMvc 자동설정(@AutoConfigureMockMvc)은 spring-boot-starter-test 에 없다.
# 웹 계층 통합 테스트가 상태 코드·헤더·Problem Details 를 검증하려면 이 모듈이 필요하다.
spring-boot-webmvc-test             = { module = "org.springframework.boot:spring-boot-webmvc-test" }
# 주의(Boot 4 모듈화): spring-boot-autoconfigure 에는 자동설정이 12개뿐이다.
#   Flyway·Kafka·OpenTelemetry 자동설정은 아래 전용 스타터에만 들어 있다.
#   이걸 빼면 spring.flyway.* / spring.kafka.* 가 조용히 무시된다(빈이 아예 안 생김).
spring-boot-starter-flyway          = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-kafka           = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-opentelemetry   = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-testcontainers          = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-docker-compose          = { module = "org.springframework.boot:spring-boot-docker-compose" }

# --- 메시징 / 영속성 ---
spring-kafka        = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test   = { module = "org.springframework.kafka:spring-kafka-test" }
flyway-core         = { module = "org.flywaydb:flyway-core" }
flyway-postgresql   = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql          = { module = "org.postgresql:postgresql" }

# --- 관측성 ---
micrometer-core             = { module = "io.micrometer:micrometer-core" }
# outbox 의 traceparent 제공자(libs/messaging, compileOnly) — 서비스에는 spring-boot-starter-opentelemetry 가 이미 싣는다(§9.2)
micrometer-tracing          = { module = "io.micrometer:micrometer-tracing" }
# MdcScope 가 id 를 현재 스팬에도 단다(libs/observability, compileOnly) · 그 검사는 SDK 로 스팬을 만든다(테스트 전용).
# 둘 다 서비스에는 spring-boot-starter-opentelemetry 가 이미 싣는다(§9.3, ADR-062 결정 4)
opentelemetry-api           = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk           = { module = "io.opentelemetry:opentelemetry-sdk" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
logback-classic             = { module = "ch.qos.logback:logback-classic" }

# --- API 문서 ---
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# --- 회복탄력성 (Boot 4 전용 모듈) ---
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

# --- 직렬화: Boot 4 기본 Jackson 은 3.x 이고 패키지가 tools.jackson.* 다 ---
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# 테스트 전용 — Prometheus 규칙 파일을 구조로 읽는다(AlertRulesConsistencyTest, ADR-060). 버전은 Boot BOM.
# 이미 spring-boot-starter 가 전이로 싣는 것을 테스트가 이름으로 선언한다 — 전이에 기대는 import 는 조용히 끊긴다.
snakeyaml = { module = "org.yaml:snakeyaml" }

# --- 널 가능성 ---
jspecify = { module = "org.jspecify:jspecify" }

# --- 테스트 ---
junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core         = { module = "org.assertj:assertj-core" }
awaitility           = { module = "org.awaitility:awaitility" }
archunit-junit5      = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

# --- Testcontainers (Boot BOM 이 testcontainers-bom 2.0.5 를 import 하므로 버전 불필요) ---
# 주의: Testcontainers 2.0 에서 모듈 좌표가 전부 `testcontainers-` 접두어로 바뀌었다.
#       1.x 의 org.testcontainers:kafka / :postgresql / :junit-jupiter 는 2.x 에 존재하지 않는다(404).
#       또한 2.x 에는 공식 redis 모듈이 없다 — Boot BOM 이 관리하는 com.redis:testcontainers-redis 를 쓴다.
testcontainers-core          = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql    = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka         = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-redis         = { module = "com.redis:testcontainers-redis" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
