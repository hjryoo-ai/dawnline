openapi: 3.1.0
info:
  title: Dawnline tracking-service
  description: |-
    기사 스캔 API (DESIGN.md §5.4). 배송 진행·ETA·지연 위험은 이 스캔에서 시작한다.

    **인증이 없다.** 고객 API 와 같은 결정이고(§10) 같은 대가를 치른다 — 라우트 id 를 아는 사람은 누구나 그 라우트의 배송 상태를 바꿀 수 있다. 라우트 id 가 UUIDv7(무작위 74비트)이라는 것이 사실상 유일한 방어다.

    **재시도해도 안전하다.** 멱등 키 헤더가 없다 — 멱등은 상태 머신이 만든다(§8.5). 같은 스캔이 다시 오면 이미 지나온 지점이라 `STALE` 로 흡수되고, 상태는 그대로다. 오프라인에서 다시 켜진 단말이 밀린 스캔을 순서 없이 보내도 같은 규칙이 흡수한다.

    **취소 뒤의 스캔도 200 이다.** 기사가 취소를 받지 못하고 배송한 경우이고 기사가 고칠 수 있는 문제가 아니다. 해당 주문 줄이 `AFTER_CANCEL` 로 온다.

    오류 응답은 RFC 9457 Problem Details 이고 `type` 과 `code` 가 항상 채워진다.
  version: 1.0.0
servers:
- url: http://localhost:8084
  description: 로컬 개발
paths:
  /api/v1/routes/{routeId}/stops/{stopSeq}/events:
    post:
      tags:
      - scan-controller
      operationId: report
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stopSeq
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
        required: true
      responses:
        "200":
          description: "받았다. `orders[]` 의 `outcome` 이 주문마다의 결과다 — `APPLIED`(상태가 옮겨\
            졌다) · `STALE`(이미 지나온 지점, 중복 스캔) · `AFTER_CANCEL`(취소된 주문이라 무시했다). **재시도\
            해도 안전하다**. 응답의 `routeId`·`stopSeq` 는 **요청을 그대로 되비친 값**이다 — 개정이 그 주문을 옮\
            겼으면 실제로 적용된 자리는 다르고, 단말이 알아야 하는 것은 주문마다의 `outcome` 이다. `DEPARTED_CAMP`\
            \ 는 `orderIds` 없이 **라우트 전체**에 적용되므로 `orders[]` 에 그 라우트의 모든 주문이 들어온다 —\
            \ 기사는 캠프를 한 번 떠나고, 그 순간 모든 배송이 길 위에 있다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: "요청 값이 유효하지 않다. 본문은 Problem Details 이고 `errors[]` 에 어긋난 필드가\
            \ 모두 들어온다. **`orderIds` 가 비어 있는 stop 스캔**과 **`orderIds` 를 실은 `DEPARTED_CAMP`**\
            \ 도 여기로 온다 — 캠프 출발은 라우트의 사건이라 열쇠가 라우트다. 지원하지 않는 API 버전도 마찬가지다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 그 `orderIds` 의 배송이 하나도 없다(`DEPARTED_CAMP` 는 그 라우트에 배송이 하나도
            없다). 아직 `route.assigned` 를 받지 못한 창일 수 있으므로 **잠시 후 같은 요청을 다시 보내도 된다**
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "상태 머신이 허용하지 않는 전이다. 역행 스캔은 409 가 아니라 200 + `STALE` 이므로, 여기\
            까지 오는 것은 상류의 결함이다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/outbox/{id}/requeue:
    post:
      tags:
      - outbox-admin-controller
      operationId: requeue
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "격리를 풀었다 — 릴레이가 다음 폴링에 집는다. **재큐는 원인을 고치지 않는다**: 원인이 남아 있으면\
            \ 다시 격리되고 `publishAttempts` 가 1 부터 다시 오른다(RB-05). 원인 수정이 먼저다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RequeuedOutboxEvent"
        "400":
          description: "`id` 가 UUID 형식이 아니다, 또는 지원하지 않는 API 버전"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 그 id 의 outbox 행이 이 서비스에 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: '`not-quarantined` — 격리된 행이 아니다. 확장 멤버 `currentState`(`PENDING`·`PUBLISHED`)와
            `publishedAt` 이 지금 위치를 말한다. 응답을 못 받은 재큐를 다시 눌러 이것을 받았으면 앞의 요청이 적용된 것이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/outbox/quarantined:
    get:
      tags:
      - outbox-admin-controller
      operationId: listQuarantined
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: 격리 시각 순. `total` 이 `events` 보다 크면 `limit` 에 잘렸다. `payload`·`headers`
            는 싣지 않는다 — 원인을 고치려고 행 전체를 봐야 하면 DB 에서 본다(RB-05 1.2)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuarantinedOutboxEvents"
        "400":
          description: '`limit` 이 1–500 밖이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    ScanRequest:
      type: object
      properties:
        orderIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 200
          minItems: 0
        type:
          type: string
          enum:
          - DEPARTED_CAMP
          - ARRIVED
          - COMPLETED
          - FAILED
        occurredAt:
          type: string
          format: date-time
        lat:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
        lng:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
        failureReason:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - occurredAt
      - type
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: "오류 코드 — `type` 의 마지막 세그먼트와 같다. 모든 오류에 실린다. 그 밖의 확장 멤버(`retryAfterSeconds`,\
            \ 검증 오류, 도메인 예외의 상세)도 이 칸처럼 최상위에 온다"
    OrderScan:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - APPLIED
          - STALE
          - AFTER_CANCEL
        status:
          type: string
          enum:
          - SCHEDULED
          - OUT_FOR_DELIVERY
          - ARRIVED
          - COMPLETED
          - FAILED
          - CANCELLED
    ScanResult:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        stopSeq:
          type: integer
          format: int32
        type:
          type: string
          enum:
          - DEPARTED_CAMP
          - ARRIVED
          - COMPLETED
          - FAILED
        occurredAt:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderScan"
    RequeuedOutboxEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
    QuarantinedOutboxEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
        createdAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        publishAttempts:
          type: integer
          format: int32
    QuarantinedOutboxEvents:
      type: object
      properties:
        total:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/QuarantinedOutboxEvent"
