openapi: 3.1.0
info:
  title: Dawnline fulfillment-service
  description: |-
    웨이브 운영 API (DESIGN.md §5.2). 지금은 조기 마감 하나다.

    **고객 API 가 아니다.** 이 표면은 ops-api 를 통해서만 노출된다 (불변규칙 4 — 코어 서비스 간 동기 호출은 금지이고 ops-api → 코어 방향만 있다). 그래서 §7.2 의 고객 레이트 리밋이 붙지 않고, 인증은 ops-api 가 맡는다.

    **조기 마감은 약속을 개정한다.** 컷오프 전에 닫으면 컷오프까지 같은 `cutoffAt` 으로 접수되는 주문은 다음 웨이브로 가고 `fulfillment.planned` 에 개정된 창이 실린다 (ADR-054). 그래서 `reason` 이 필수다.

    **조기 마감은 멱등이 아니다 — 두 번째 요청은 말한다.** 이미 닫힌 웨이브는 409 `wave-not-open` 이고 `closeCause` 가 누가 닫았는지 알려 준다. `Retry-After` 를 쓰는 오류는 없다.

    오류 응답은 RFC 9457 Problem Details 이고 `type` 과 `code` 가 항상 채워진다.
  version: 1.0.0
servers:
- url: http://localhost:8082
  description: 로컬 개발
paths:
  /api/v1/waves/{waveId}/close:
    post:
      tags:
      - wave-controller
      operationId: close
      parameters:
      - name: waveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseWaveRequest"
        required: true
      responses:
        "200":
          description: "닫았다 — `closeCause=MANUAL`, `wave.closed` 가 outbox 에 들어갔다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveView"
        "400":
          description: "`reason` 이 비었거나 200자를 넘는다, 또는 `waveId` 가 UUID 형식이 아니다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 없는 웨이브
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: '`wave-not-open` — 이미 닫혀 있다. 확장 멤버 `currentState`·`closeCause`·`closedAt`
            이 누가 언제 닫았는지 말한다. 응답을 못 받은 마감을 다시 눌러 이것을 받았고 `closeCause` 가 `MANUAL` 이면
            앞의 요청이 적용된 것이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 내부 토큰(`X-Dawnline-Internal`)이 없거나 다르다 — `internal-token-required`.
            운영자는 ops-api 를 거친다 (ADR-055)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - internalToken: []
  /api/v1/admin/outbox/{id}/requeue:
    post:
      tags:
      - outbox-admin-controller
      operationId: requeue
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "격리를 풀었다 — 릴레이가 다음 폴링에 집는다. **재큐는 원인을 고치지 않는다**: 원인이 남아 있으면\
            \ 다시 격리되고 `publishAttempts` 가 1 부터 다시 오른다(RB-05). 원인 수정이 먼저다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RequeuedOutboxEvent"
        "400":
          description: "`id` 가 UUID 형식이 아니다, 또는 지원하지 않는 API 버전"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 그 id 의 outbox 행이 이 서비스에 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: '`not-quarantined` — 격리된 행이 아니다. 확장 멤버 `currentState`(`PENDING`·`PUBLISHED`)와
            `publishedAt` 이 지금 위치를 말한다. 응답을 못 받은 재큐를 다시 눌러 이것을 받았으면 앞의 요청이 적용된 것이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 내부 토큰(`X-Dawnline-Internal`)이 없거나 다르다 — `internal-token-required`.
            운영자는 ops-api 를 거친다 (ADR-055)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - internalToken: []
  /api/v1/admin/outbox/quarantined:
    get:
      tags:
      - outbox-admin-controller
      operationId: listQuarantined
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: 격리 시각 순. `total` 이 `events` 보다 크면 `limit` 에 잘렸다. `payload`·`headers`
            는 싣지 않는다 — 원인을 고치려고 행 전체를 봐야 하면 DB 에서 본다(RB-05 1.2)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuarantinedOutboxEvents"
        "400":
          description: '`limit` 이 1–500 밖이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    CloseWaveRequest:
      type: object
      properties:
        reason:
          type: string
          description: 왜 닫는가 — 감사 행과 마감 로그에 남는다. 컷오프 전 마감이면 남은 시간 동안 접수되는 주문은 약속이
            개정된다
          maxLength: 200
          minLength: 1
      required:
      - reason
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: "오류 코드 — `type` 의 마지막 세그먼트와 같다. 모든 오류에 실린다. 그 밖의 확장 멤버(`retryAfterSeconds`,\
            \ 검증 오류, 도메인 예외의 상세)도 이 칸처럼 최상위에 온다"
    WaveView:
      type: object
      properties:
        waveId:
          type: string
          format: uuid
        campId:
          type: string
          format: uuid
        serviceTier:
          type: string
          enum:
          - DAWN
          - SAME_DAY
          - NEXT_DAY
        cutoffAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - OPEN
          - CLOSING
          - CLOSED
          - PLANNED
          - PLAN_FAILED
        orderCount:
          type: integer
          format: int32
        closedAt:
          type: string
          format: date-time
        closeCause:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
    RequeuedOutboxEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
    QuarantinedOutboxEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
        createdAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        publishAttempts:
          type: integer
          format: int32
    QuarantinedOutboxEvents:
      type: object
      properties:
        total:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/QuarantinedOutboxEvent"
  securitySchemes:
    internalToken:
      type: apiKey
      description: "코어의 운영자 쓰기 커맨드에 필요한 내부 토큰 (DESIGN.md §10 셋째 층, ADR-055). ops-api\
        \ 가 싣는다 — 운영자는 ops-api 를 거친다."
      name: X-Dawnline-Internal
      in: header
