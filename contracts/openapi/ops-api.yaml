openapi: 3.1.0
info:
  title: Dawnline ops-api
  description: |-
    운영 콘솔 API (DESIGN.md §5.5). 읽기 모델 조회와 운영자 커맨드다.

    **인증은 JWT 다.** `make token ROLE=…` 가 찍은 토큰을 `Authorization: Bearer` 로 싣는다 (만료 12시간). `GET` 은 `OPS_VIEWER`, 나머지는 `OPS_OPERATOR` 이상이다. 토큰이 없거나 유효하지 않으면 401 `unauthenticated`, 역할이 모자라면 403 `forbidden` 이다.

    **커맨드는 코어로 위임하고 감사한다.** 응답 헤더 `X-Dawnline-Audit-Id` 에 감사 행 id 가 온다. 코어가 거절하면(4xx) 코어의 상태와 Problem Details 본문을 그대로 돌려준다. 코어에 닿지 못하면 502 `core-unreachable`, 적용됐는지 모르면 504 `core-timeout` 또는 502 `core-error` 다 — 그때는 다시 누르기가 먼저다(RB-07).

    **조회는 감사하지 않는다.** 읽기 모델(`rm_*`)에서 읽고, 라우트의 stop 은 dispatch 에 조회를 위임한다 — 좌표와 순서의 진실은 dispatch 이고 읽기 모델은 집계다.

    오류 응답은 RFC 9457 Problem Details 이고 `type` 과 `code` 가 항상 채워진다.
  version: 1.0.0
servers:
- url: http://localhost:8085
  description: 로컬 개발
paths:
  /api/v1/waves/{waveId}/close:
    post:
      tags:
      - ops-command-controller
      operationId: closeWave
      parameters:
      - name: waveId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseBody"
        required: true
      responses:
        "200":
          description: 닫힌 웨이브 — `closeCause=MANUAL`
          headers:
            X-Dawnline-Audit-Id:
              description: 감사 행 id — 모든 결과에 온다
              style: simple
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveClosed"
        "400":
          description: "`reason` 이 비었거나 200자를 넘는다(감사 행 없음), 또는 코어의 거절 그대로"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 코어의 거절 그대로 — 없는 웨이브
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: 코어의 거절 그대로 — `wave-not-open`. `closeCause` 가 `MANUAL` 이면 앞의
            요청이 적용됐다(RB-07)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: '`core-unreachable`(닿지 않았다 — 감사 `FAILED`) 또는 `core-error`(코어의
            5xx — 감사 `UNKNOWN`)'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: 감사 행을 쓰지 못해 위임하지 않았다 — 기록 없는 커맨드는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: '`core-timeout` — 적용됐는지 모른다(감사 `UNKNOWN`). 다시 누르기가 먼저다(RB-07)'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
  /api/v1/routes/{routeId}/stops/{orderId}/reassign:
    post:
      tags:
      - ops-command-controller
      operationId: reassign
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignBody"
        required: true
      responses:
        "200":
          description: 두 라우트의 새 revision
          headers:
            X-Dawnline-Audit-Id:
              description: 감사 행 id — 모든 결과에 온다
              style: simple
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StopReassigned"
        "400":
          description: "`targetRouteId` 가 없다(감사 행 없음), 또는 코어의 거절 그대로"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 코어의 거절 그대로 — 없는 라우트·주문
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "코어의 거절 그대로 — 옮길 수 없는 상태(출발한 라우트, 끝난 stop 등)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: '`core-unreachable`(닿지 않았다 — 감사 `FAILED`) 또는 `core-error`(코어의
            5xx — 감사 `UNKNOWN`)'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: 감사 행을 쓰지 못해 위임하지 않았다 — 기록 없는 커맨드는 없다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: '`core-timeout` — 적용됐는지 모른다(감사 `UNKNOWN`). 다시 누르기가 먼저다(RB-07)'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
