          type: string
          format: date-time
      responses:
        "200":
          description: "컷오프 순, 최대 500. 칸이 `null` 이면 그 사실이 아직 오지 않았다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WaveList"
        "400":
          description: "창이 뒤집혔거나 7일을 넘는다, 또는 형식이 틀렸다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
  /api/v1/camps/{campId}/exceptions:
    get:
      tags:
      - read-model-controller
      operationId: exceptions
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "취소됐는데 배송된 주문(§6.10 넷째 분기) — KPI 와 같은 버킷 창, 배송 시각 역순, 최대 200.\
            \ 자동 보상은 없고 사람이 처리한다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExceptionList"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
  /api/v1/admin/outbox/{service}/quarantined:
    get:
      tags:
      - core-outbox-controller
      operationId: listQuarantined
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: 격리 시각 순. `total` 이 목록보다 크면 `limit` 에 잘렸다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuarantinedOutbox"
        "400":
          description: 코어의 거절 그대로 — `limit` 이 1–500 밖이다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "`{service}` 가 order·fulfillment·dispatch·tracking 이 아니다"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: '`core-unreachable` 또는 `core-error`'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: '`core-timeout`'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
  /api/v1/admin/dlq/{topic}:
    get:
      tags:
      - dlq-controller
      operationId: list
      parameters:
      - name: topic
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: 위치와 이름뿐 — value 는 싣지 않는다(주소를 담을 수 있다)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "400":
          description: '`limit` 이 1–500 밖이다'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: 계약에 없는 토픽
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: 토큰이 없거나 유효하지 않다 — `unauthenticated`. 토큰을 다시 넣는다
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "역할이 모자란다 — `forbidden`. 조회는 `OPS_VIEWER`, 커맨드는 `OPS_OPERATOR`\
            \ 이상"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - opsJwt: []
components:
  schemas:
    CloseBody:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - reason
    WaveClosed:
      type: object
      properties:
        waveId:
          type: string
          format: uuid
        status:
          type: string
        closeCause:
          type:
          - string
          - "null"
        closedAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - status
      - waveId
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: "오류 코드 — `type` 의 마지막 세그먼트와 같다. 모든 오류에 실린다. 그 밖의 확장 멤버(`retryAfterSeconds`,\
            \ 검증 오류, 도메인 예외의 상세)도 이 칸처럼 최상위에 온다"
    ReassignBody:
      type: object
      properties:
        targetRouteId:
          type: string
          format: uuid
      required:
      - targetRouteId
    StopReassigned:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        fromRouteId:
          type: string
          format: uuid
        fromRevision:
          type: integer
          format: int32
        toRouteId:
          type: string
          format: uuid
        toRevision:
          type: integer
          format: int32
      required:
      - fromRevision
      - fromRouteId
      - orderId
      - toRevision
      - toRouteId
    PlanRun:
      type: object
      properties:
        waveId:
          type: string
          format: uuid
        outcome:
          type: string
      required:
      - outcome
      - waveId
    CancelBody:
      type: object
      properties:
        reason:
          type:
          - string
          - "null"
          maxLength: 200
          minLength: 0
    OrderCancelled:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
      required:
      - orderId
      - status
    OutboxRequeued:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
      required:
      - aggregateId
      - aggregateType
      - eventType
      - id
      - topic
    Pick:
      type: object
      properties:
        partition:
          type: integer
          format: int32
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
      required:
      - offset
      - partition
    ReplayBody:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/Pick"
          maxItems: 100
          minItems: 0
      required:
      - records
    ReplayResponse:
      type: object
      properties:
        topic:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReplayResult"
      required:
      - results
      - topic
    ReplayResult:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        auditId:
          type: string
          format: uuid
        eventId:
          type:
          - string
          - "null"
          format: uuid
        result:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - REJECTED
          - FAILED
          - UNKNOWN
        detail:
          type:
          - string
          - "null"
      required:
      - auditId
      - offset
      - partition
      - result
    Depot:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required:
      - lat
      - lng
    RouteSummary:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        vehicleId:
          type:
          - string
          - "null"
          format: uuid
        revision:
          type:
          - integer
          - "null"
          format: int32
        status:
          type:
          - string
          - "null"
          enum:
          - ASSIGNED
          - DEPARTED
        plannedDeparture:
          type:
          - string
          - "null"
          format: date-time
        departedAt:
          type:
          - string
          - "null"
          format: date-time
        stopCount:
          type:
          - integer
          - "null"
          format: int32
        completedCount:
          type:
          - integer
          - "null"
          format: int32
        failedCount:
          type:
          - integer
          - "null"
          format: int32
        atRisk:
          type:
          - boolean
          - "null"
        distanceM:
          type:
          - integer
          - "null"
          format: int32
        costKrw:
          type:
          - integer
          - "null"
          format: int32
      required:
      - routeId
    WaveRoutes:
      type: object
      properties:
        waveId:
          type: string
          format: uuid
        planId:
          type:
          - string
          - "null"
          format: uuid
        depot:
          anyOf:
          - $ref: "#/components/schemas/Depot"
          - type: "null"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteSummary"
      required:
      - routes
      - waveId
    RouteDetail:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        status:
          type: string
        revision:
          type: integer
          format: int32
        distanceM:
          type: integer
          format: int32
        durationS:
          type: integer
          format: int32
        costKrw:
          type: integer
          format: int64
        stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
      required:
      - costKrw
      - distanceM
      - durationS
      - planId
      - revision
      - routeId
      - status
      - stops
      - vehicleId
    RouteStop:
      type: object
      properties:
        seq:
          type: integer
          format: int32
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        plannedArrival:
          type: string
          format: date-time
        status:
          type: string
        orderIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - lat
      - lng
      - orderIds
      - plannedArrival
      - seq
      - status
    CampKpi:
      type: object
      properties:
        campId:
          type: string
          format: uuid
        delivered:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        onTimePromised:
          type: integer
          format: int64
        onTimeRevised:
          type: integer
          format: int64
        revised:
          type: integer
          format: int64
        onTimeRatioPromised:
          type:
          - number
          - "null"
          format: double
        onTimeRatioRevised:
          type:
          - number
          - "null"
          format: double
      required:
      - campId
      - delivered
      - failed
      - onTimePromised
      - onTimeRevised
      - revised
    DeliveryKpi:
      type: object
      properties:
        firstBucket:
          type: string
          format: date-time
        lastBucket:
          type: string
          format: date-time
        camps:
          type: array
          items:
            $ref: "#/components/schemas/CampKpi"
        outcomeWithoutPromise:
          type: integer
          format: int64
      required:
      - camps
      - firstBucket
      - lastBucket
      - outcomeWithoutPromise
    CampList:
      type: object
      properties:
        camps:
          type: array
          items:
            $ref: "#/components/schemas/CampSummary"
      required:
      - camps
    CampSummary:
      type: object
      properties:
        campId:
          type: string
          format: uuid
        waves:
          type: integer
          format: int64
        latestCutoffAt:
          type:
          - string
          - "null"
          format: date-time
      required:
      - campId
      - waves
    WaveList:
      type: object
      properties:
        campId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        waves:
          type: array
          items:
            $ref: "#/components/schemas/WaveSummary"
      required:
      - campId
      - from
      - to
      - waves
    WaveSummary:
      type: object
      properties:
        waveId:
          type: string
          format: uuid
        serviceTier:
          type:
          - string
          - "null"
        cutoffAt:
          type:
          - string
          - "null"
          format: date-time
        status:
          type:
          - string
          - "null"
          enum:
          - OPEN
          - CLOSED
          - PLAN_FAILED
          - PLANNED
        orderCount:
          type:
          - integer
          - "null"
          format: int32
        planId:
          type:
          - string
          - "null"
          format: uuid
        planDurationMs:
          type:
          - integer
          - "null"
          format: int32
        totalCostKrw:
          type:
          - integer
          - "null"
          format: int64
        unassignedCount:
          type:
          - integer
          - "null"
          format: int32
        routeCount:
          type:
          - integer
          - "null"
          format: int32
      required:
      - waveId
    CancelledButDelivered:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        waveId:
          type:
          - string
          - "null"
          format: uuid
        routeId:
          type:
          - string
          - "null"
          format: uuid
        deliveredAt:
          type: string
          format: date-time
      required:
      - deliveredAt
      - orderId
    ExceptionList:
      type: object
      properties:
        campId:
          type: string
          format: uuid
        firstBucket:
          type: string
          format: date-time
        lastBucket:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CancelledButDelivered"
        truncated:
          type: boolean
      required:
      - campId
      - firstBucket
      - lastBucket
      - orders
      - truncated
    QuarantinedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        eventType:
          type: string
        topic:
          type: string
        createdAt:
          type: string
          format: date-time
        failedAt:
          type: string
          format: date-time
        publishAttempts:
          type: integer
          format: int32
      required:
      - aggregateId
      - aggregateType
      - createdAt
      - eventType
      - failedAt
      - id
      - publishAttempts
      - topic
    QuarantinedOutbox:
      type: object
      properties:
        total:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/QuarantinedEvent"
      required:
      - events
      - total
    DeadLetterList:
      type: object
      properties:
        topic:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/DeadLetterView"
      required:
      - records
      - topic
    DeadLetterView:
      type: object
      properties:
        partition:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        eventType:
          type:
          - string
          - "null"
        eventId:
          type:
          - string
          - "null"
          format: uuid
        originalGroup:
          type:
          - string
          - "null"
        originalPartition:
          type:
          - integer
          - "null"
          format: int32
        originalOffset:
          type:
          - integer
          - "null"
          format: int64
        exceptionClass:
          type:
          - string
          - "null"
      required:
      - offset
      - partition
      - timestamp
  securitySchemes:
    opsJwt:
      type: http
      description: '`make token ROLE=OPS_VIEWER|OPS_OPERATOR|ADMIN` 가 찍는 HS256 토큰
        (DESIGN.md §5.5)'
      scheme: bearer
      bearerFormat: JWT
